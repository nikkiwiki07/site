<svg viewBox="0 0 1600 1000" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="planetShade" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#4a3570"/>
      <stop offset="100%" stop-color="#160f26"/>
    </radialGradient>
    <radialGradient id="planetShade2" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#3a2a5c"/>
      <stop offset="100%" stop-color="#100a1c"/>
    </radialGradient>
  </defs>

  <g fill="none" stroke="#6b4a9e" stroke-width="2.5" stroke-linecap="round" opacity="0.55">
    <path d="M -20 90 C 160 40, 220 190, 400 130 S 640 20, 760 110" />
    <path d="M 520 140 C 600 200, 560 300, 470 330" />
    <path d="M 120 480 C 260 430, 300 560, 460 520 S 700 430, 780 520 S 1000 610, 1120 540" />
    <path d="M 1180 60 C 1300 20, 1340 140, 1460 110 S 1650 60, 1700 140" />
    <path d="M 1080 780 C 1220 720, 1280 850, 1420 800 S 1640 720, 1720 800" />
    <path d="M -40 760 C 80 700, 140 830, 260 790 S 420 700, 470 800" />
    <path d="M 700 860 C 820 900, 780 980, 900 990" opacity="0.4"/>
  </g>

  <g stroke="#8a63c4" stroke-width="1.4" opacity="0.35" fill="none">
    <path d="M 60 70 C 100 130, 60 180, 110 230" />
    <path d="M 1500 500 C 1540 560, 1490 600, 1530 660" />
  </g>

  <!-- top-left ringed planet -->
  <g transform="translate(70,60)">
    <circle cx="0" cy="0" r="72" fill="url(#planetShade)" stroke="#5b3f8a" stroke-width="2" opacity="0.9"/>
    <path d="M -95 10 C -50 -35, 50 -35, 95 10 C 50 30, -50 30, -95 10 Z" fill="none" stroke="#5b3f8a" stroke-width="2" opacity="0.7"/>
    <circle cx="-20" cy="-15" r="8" fill="none" stroke="#7a56b8" stroke-width="1.5" opacity="0.6"/>
    <circle cx="25" cy="20" r="5" fill="none" stroke="#7a56b8" stroke-width="1.5" opacity="0.6"/>
  </g>

  <!-- upper-right saturn -->
  <g transform="translate(1330,140) rotate(-12)">
    <circle cx="0" cy="0" r="58" fill="url(#planetShade2)" stroke="#5b3f8a" stroke-width="2" opacity="0.9"/>
    <ellipse cx="0" cy="0" rx="115" ry="20" fill="none" stroke="#5b3f8a" stroke-width="2.5" opacity="0.8"/>
    <ellipse cx="0" cy="0" rx="115" ry="20" fill="none" stroke="#160f26" stroke-width="10" opacity="0.9" clip-path="inset(0 0 20px 0)"/>
  </g>

  <!-- lower-left cratered moon -->
  <g transform="translate(90,900)">
    <circle cx="0" cy="0" r="95" fill="url(#planetShade)" stroke="#5b3f8a" stroke-width="2" opacity="0.9"/>
    <circle cx="-30" cy="-20" r="14" fill="none" stroke="#7a56b8" stroke-width="1.5" opacity="0.5"/>
    <circle cx="20" cy="10" r="9" fill="none" stroke="#7a56b8" stroke-width="1.5" opacity="0.5"/>
    <circle cx="10" cy="-40" r="6" fill="none" stroke="#7a56b8" stroke-width="1.5" opacity="0.5"/>
  </g>

  <!-- lower-right planet -->
  <g transform="translate(1500,880)">
    <circle cx="0" cy="0" r="110" fill="url(#planetShade2)" stroke="#5b3f8a" stroke-width="2" opacity="0.9"/>
    <path d="M -110 -30 C -60 -10, 60 -10, 110 -30" fill="none" stroke="#7a56b8" stroke-width="1.5" opacity="0.5"/>
    <path d="M -100 20 C -50 40, 50 40, 100 20" fill="none" stroke="#7a56b8" stroke-width="1.5" opacity="0.5"/>
  </g>

  <!-- small sun/star burst mid-left -->
  <g transform="translate(60,340)" stroke="#8a63c4" stroke-width="2" opacity="0.6" fill="none">
    <circle r="22"/>
    <path d="M -34 0 L -40 0 M 34 0 L 40 0 M 0 -34 L 0 -40 M 0 34 L 0 40 M -24 -24 L -29 -29 M 24 24 L 29 29 M 24 -24 L 29 -29 M -24 24 L -29 29"/>
  </g>

  <!-- scattered 4-point stars -->
  <g fill="#cbb8ea" opacity="0.85">
    <path d="M 380 20 L 386 34 L 400 40 L 386 46 L 380 60 L 374 46 L 360 40 L 374 34 Z"/>
    <path d="M 900 300 L 904 310 L 914 314 L 904 318 L 900 328 L 896 318 L 886 314 L 896 310 Z"/>
    <path d="M 1200 480 L 1205 492 L 1217 497 L 1205 502 L 1200 514 L 1195 502 L 1183 497 L 1195 492 Z"/>
    <path d="M 220 620 L 224 630 L 234 634 L 224 638 L 220 648 L 216 638 L 206 634 L 216 630 Z"/>
    <path d="M 1050 90 L 1053 98 L 1061 101 L 1053 104 L 1050 112 L 1047 104 L 1039 101 L 1047 98 Z"/>
    <path d="M 640 560 L 643 568 L 651 571 L 643 574 L 640 582 L 637 574 L 629 571 L 637 568 Z"/>
    <path d="M 1440 350 L 1443 358 L 1451 361 L 1443 364 L 1440 372 L 1437 364 L 1429 361 L 1437 358 Z"/>
    <path d="M 500 880 L 503 888 L 511 891 L 503 894 L 500 902 L 497 894 L 489 891 L 497 888 Z"/>
  </g>
</svg>
